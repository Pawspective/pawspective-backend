components_manager:
    task_processors:

        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:
        testsuite-support:

        http-client:

        http-client-middleware-pipeline:

        default-secdist-provider:
            config: /home/user/pawspective/secdist.json
            missing-ok: false


        secdist:
            provider: default-secdist-provider
        

        dns-client:
            fs-task-processor: fs-task-processor
#        redis-session:
#            groups:
#                - db: 0
#                  config_name: master
#            subscribe_groups: []
#            thread_pools:
#                redis_thread_pool_size: 8
#                sentinel_thread_pool_size: 1
            
        postgres-db:
            dbconnection: 'postgresql://user:password@localhost:5432/postgres-db'
            blocking_task_processor: fs-task-processor
            dns_resolver: async

        jwt-service:
            secret_key: $JWT_SECRET_KEY
            access_ttl: 3600
            refresh_ttl: 86400
        
        session-service-pg:
            load-enabled: true 

#        session-service-redis:
#            load-enabled: true

        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        handler-health-check:
            path: /health
            method: GET
            task_processor: main-task-processor

        handler-auth-me:
            path: /auth/me
            method: GET
            task_processor: main-task-processor