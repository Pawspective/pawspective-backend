version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawspective
      POSTGRES_USER: pawspective_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/schemas:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawspective_user -d pawspective"]
      interval: 10s
      timeout: 5s
      retries: 5

  pawspective:
    image: ghcr.io/pawspective/pawspective-backend:latest
    container_name: pawspective
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/secdist.json:/app/secrets/secdist.json:ro
      - ./configs/static_config.yaml:/app/etc/pawspective/static_config.yaml:ro
      - ./configs/config_vars.yaml:/app/etc/pawspective/config_vars.yaml:ro
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - pawspective
    networks:
      - internal

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
