name: CI (fast checks)


on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-debug
          key: ${{ runner.os }}-cmake-lint-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-lint-

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y clang-format clang-tidy cppcheck python3-autopep8 libargon2-dev

      - name: Generate Compilation Database
        run: |
          cmake -B build-debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUSERVER_USE_ZSTD=OFF \
            .

      - name: Get changed C++ files
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.event.pull_request.base.ref }}" HEAD \
            | grep -E '\.(cpp|hpp)$' | grep '^src/' | tr '\n' ' ' || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Run lint checks (all files)
        if: github.event_name != 'pull_request'
        run: make lint

      - name: Run lint checks (changed files only)
        if: github.event_name == 'pull_request'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: make lint

