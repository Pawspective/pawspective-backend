name: Docker build & test

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - '**'

jobs:
    build-test:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            build_type: [debug, release]
          fail-fast: false

        container:
            image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg-dev:latest
            options: >
                --cap-add=SYS_PTRACE
                --security-opt seccomp=unconfined

        steps:
          - uses: actions/checkout@v4
            with:
              submodules: true

          - name: Create Secdist file
            run: |
              echo '${{ secrets.SECURE_DATA_JSON }}' > secdist.json

          - name: Cache CPM dependencies
            uses: actions/cache@v4
            with:
              path: build-${{ matrix.build_type }}/_deps
              key: ${{ runner.os }}-cpm-${{ matrix.build_type }}
              restore-keys: |
                ${{ runner.os }}-cpm-${{ matrix.build_type }}-

          - name: Cache ccache
            uses: actions/cache@v4
            with:
              path: /tmp/ccache
              key: ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ github.sha }}
              restore-keys: |
                ${{ runner.os }}-ccache-${{ matrix.build_type }}-

          - name: Fix permissions
            run: |
              sudo chown -R user:user .
              mkdir -p /tmp/ccache
              sudo chown -R user:user /tmp/ccache

          - name: Install dependencies
            run: sudo apt update && sudo apt install -y libargon2-dev ccache

          - name: Configure ccache
            run: |
              sudo -u user ccache --set-config=cache_dir=/tmp/ccache
              sudo -u user ccache --set-config=max_size=2G
              sudo -u user ccache --set-config=compression=true
              sudo -u user ccache --zero-stats

          - name: Configure
            run: >-
              sudo -u user env
              CCACHE_DIR=/tmp/ccache
              CMAKE_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
              make cmake-${{ matrix.build_type }}

          - name: Build
            run: sudo -u user env CCACHE_DIR=/tmp/ccache cmake --build build-${{ matrix.build_type }} -j $(nproc)

          - name: Run tests
            run: sudo -u user make test-${{ matrix.build_type }}

          - name: Show ccache stats
            if: always()
            run: ccache --set-config=cache_dir=/tmp/ccache && ccache --show-stats
