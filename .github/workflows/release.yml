name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release bundle
        run: |
          RELEASE_DIR="pawspective-backend-${{ github.ref_name }}"

          mkdir -p "$RELEASE_DIR"

          cp docker-compose.yml "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/"
          cp secdist.example.json "$RELEASE_DIR/"

          cp -r configs "$RELEASE_DIR/"
          cp -r nginx "$RELEASE_DIR/"
          cp -r postgresql "$RELEASE_DIR/"

          tar \
            --sort=name \
            --mtime='UTC 2025-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "${RELEASE_DIR}.tar.gz" \
            "$RELEASE_DIR"

          cp "${RELEASE_DIR}.tar.gz" pawspective-backend-latest.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pawspective-backend-${{ github.ref_name }}.tar.gz
            pawspective-backend-latest.tar.gz