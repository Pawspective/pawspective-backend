name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release bundle
        run: |
          RELEASE_DIR="pawspective-backend"

          mkdir -p "$RELEASE_DIR"

          cp docker-compose.yml "$RELEASE_DIR/"
          cp README.md "$RELEASE_DIR/"
          cp secdist.example.json "$RELEASE_DIR/"

          cp -r configs "$RELEASE_DIR/"
          cp -r nginx "$RELEASE_DIR/"
          cp -r postgresql "$RELEASE_DIR/"

          tar \
            --sort=name \
            --mtime='UTC 2026-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "${RELEASE_DIR}.tar.gz" \
            "$RELEASE_DIR"

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            pawspective-backend.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}